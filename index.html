<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <nav class="menuNavegacao">
        <a href="index.html" class="linkMenu ativo">Login</a>
        <a href="sobre.html" class="linkMenu">Sobre</a>
        <a href="exercicio.html" class="linkMenu">Exercício</a>
    </nav>

    <div class="containerPrincipal">
        <div class="caixaLogin">
            
            <div class="areaFormulario">
                <h1 class="tituloLogin">Faça seu login<span class="pontoRosa">.</span></h1>
                
                <form class="formulario">
                    <div class="inputLogin">
                        <label for="email" class="labelInput">Email</label>
                        <input type="email" id="email" class="campoInput" placeholder="seuemail@exemplo.com">
                    </div>
                    
                    <div class="inputLogin">
                        <label for="senha" class="labelInput">Senha</label>
                        <input type="password" id="senha" class="campoInput" placeholder="********">
                    </div>
                    
                    <div class="linksEnfeite">
                        <a href="#" class="linkPequeno">Esqueci minha senha</a>
                    </div>
                    
                    <button type="submit" class="btnEntrar">Entrar</button>
                    
                    <div class="linkConta">
                        <a href="#" class="linkPequeno">Ainda não tenho uma conta</a>
                    </div>
                </form>
            </div>

            <div class="imagem">
                
            </div>
            
        </div>
    </div>
</body>
</html>
